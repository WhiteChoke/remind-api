spring:
  application:
    name: remind
  datasource:
    url: jdbc:postgresql://localhost:5432/remind
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

jwt:
  secret-key: ${JWT_KEY}
  access-expiry-ms: 900000
  refresh-expiry-ms: 2592000000
